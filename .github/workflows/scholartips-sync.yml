name: ScholarTips • publish approved scholarships

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # About twice per hour; GitHub may delay or skip scheduled jobs.
    - cron: '12,42 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scholartips-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build only public scholarships
        env:
          PUBLIC_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5mXl60LP6qYGonsGwh6KFfv-_QIuijcDHvIGhydoaj45z3RIMCSZoz-Nje0llIGik9LEOiXgbLUyC/pub?gid=1247632278&single=true&output=csv'
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit
          import csv, io, os, hashlib, datetime, re

          source = os.environ['PUBLIC_CSV_URL']
          req = Request(source, headers={'User-Agent': 'ScholarTips-Public-Data-Builder/1.0'})
          with urlopen(req, timeout=60) as response:
              raw = response.read(4_000_001)
          if len(raw) > 4_000_000:
              raise RuntimeError('Data feed too large: aborting public deployment')
          content = raw.decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(content))
          if not reader.fieldnames:
              raise RuntimeError('Missing published CSV header. Check sheet published-to-web settings.')

          def norm(value):
              return re.sub(r'\s+', ' ', str(value or '').strip().casefold())
          headers = {norm(name): name for name in reader.fieldnames}
          required = {'scholarship name','host country','degree level','funding type','official scholarship link'}
          if not required.issubset(headers):
              raise RuntimeError('WRONG SHEET OR FORMAT: public CSV header columns are ' + str(reader.fieldnames))
          sensitive = {'timestamp','email','email address','review status',
                       'are afghan students eligible','submitter email','contact email'}
          if sensitive.intersection(headers):
              raise RuntimeError('PRIVACY STOP: private columns are present in the published CSV!')

          def get(row, name):
              return str(row.get(headers.get(norm(name), ''), '') or '').strip()
          def web_link(value):
              value = value.strip()
              try:
                  parsed = urlsplit(value)
                  if parsed.scheme not in ('https','http') or not parsed.hostname or parsed.username or parsed.password:
                      return ''
                  return value[:1800]
              except ValueError:
                  return ''
          def date_iso(value):
              value = value.strip().split(' ')[0]
              for fmt in ('%Y-%m-%d', '%m/%d/%Y', '%m/%d/%y'):
                  try:
                      return datetime.datetime.strptime(value, fmt).date().isoformat()
                  except ValueError:
                      pass
              return ''

          output_columns = ['id','name','country','university','degree_level','funding_type',
              'deadline','deadline_status','application_url','source_url',
              'field_of_study','afghan_eligible','verification_status',
              'last_verified','notes','moderation_status']
          rows = []
          seen = set()
          for row in reader:
              name = get(row,'scholarship name')[:300]
              country = get(row,'host country')[:120]
              link = web_link(get(row,'official scholarship link'))
              if not name or not country or not link:
                  continue
              identity = '|'.join((name, country, get(row,'university / organization')))
              key = hashlib.sha256(identity.casefold().encode('utf-8')).hexdigest()[:16]
              if key in seen:
                  continue
              seen.add(key)
              rows.append({
                  'id':key, 'name':name, 'country':country,
                  'university':get(row,'university / organization')[:300],
                  'degree_level':get(row,'degree level')[:120],
                  'funding_type':get(row,'funding type')[:100],
                  'deadline':date_iso(get(row,'application deadline')),
                  'deadline_status':get(row,'deadline status')[:120],
                  'application_url':link, 'source_url':link,
                  'field_of_study':get(row,'field of study')[:300],
                  'afghan_eligible':'yes',
                  # Team approval, but no fabricated date or 'independently verified' claim.
                  'verification_status':'', 'last_verified':'',
                  'notes':get(row,'additional information')[:1000],
                  'moderation_status':'approved'
              })
          target = Path('_site/data')
          target.mkdir(parents=True, exist_ok=True)
          with (target/'scholarships.csv').open('w', encoding='utf-8',newline='') as fp:
              w = csv.DictWriter(fp, fieldnames=output_columns)
              w.writeheader()
              w.writerows(rows)
          Path('_site/index.html').write_bytes(Path('index.html').read_bytes())
          Path('_site/.nojekyll').touch()
          print('SUCCESS: prepared',len(rows),'approved public scholarship records')
          PYCODE
      - name: Upload site package
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
